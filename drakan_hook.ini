; drakan_hook.ini - goes next to Drakan.exe together with our ddraw.dll

[chain]
; The real DirectDraw to forward to, relative to the game folder or absolute.
; Empty = the system ddraw.dll. To keep using dgVoodoo2, rename its DDraw.dll to
; ddraw_dgvoodoo.dll and set:  ddraw=ddraw_dgvoodoo.dll
ddraw=

[hooks]
; 0 = pure proxy (no game patches), to rule the hooks in or out when testing
enable=1

[capture]
; Press F10 in game to capture the next frame into drakan_hook.log.
; Optionally also capture automatically:
first_frame=0
every_frames=0
max_objects=6
max_polys=12
verts_per_object=4

[dump]
; write drakan_dump\level_NNN_<name>.dklv after each level load
terrain=1
; also write that level's terrain textures as DDS + manifest.txt into drakan_dump\level_NNN_<name>_tex\
textures=1

[freecam]
; Fly camera (view only, the player stays put). NumLock must be on.
; F9 toggle | Num8/Num5 forward/back | Num4/Num6 strafe | Num9/Num3 up/down
; Num1/Num7 speed x2 / x0.5 | Num. jump back to the game camera | F11 log camera position
; Keys are Windows virtual-key codes (decimal), e.g. key_toggle=120 is F9.
enable=1
speed=4096
; draw the sky dome around the free camera instead of the game camera (avoids hall of mirrors)
move_sky=1

[surfspy]
; log every distinct caller of the game's surface Blt / Lock / Flip (2D drawing outside the 3D device)
enable=1

[census]
; M0: log every DirectDraw/Direct3D method the game calls (counts per calling module, arguments of key calls)
enable=1
