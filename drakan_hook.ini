; drakan_hook.ini - goes next to Drakan.exe together with our ddraw.dll

[chain]
; The real DirectDraw to forward to, relative to the game folder or absolute.
; Empty = the system ddraw.dll. To keep using dgVoodoo2, rename its DDraw.dll to
; ddraw_dgvoodoo.dll and set:  ddraw=ddraw_dgvoodoo.dll
ddraw=

[hooks]
; 0 = pure proxy (no game patches), to rule the hooks in or out when testing
enable=1

[capture]
; Press F10 in game to capture the next frame into drakan_hook.log.
; Optionally also capture automatically:
first_frame=0
every_frames=0
max_objects=6
max_polys=12
verts_per_object=4

[dump]
; write drakan_dump\level_NNN_<name>.dklv after each level load
terrain=1
; also write that level's terrain textures as DDS + manifest.txt into drakan_dump\level_NNN_<name>_tex\
textures=1
; M4 step 1: write every model the game draws, once, as OBJ + MTL + DDS into drakan_dump\meshes_<level>\
meshes=1

[freecam]
; Fly camera (view only, the player stays put). NumLock must be on.
; F9 toggle | Num8/Num5 forward/back | Num4/Num6 strafe | Num9/Num3 up/down
; Num1/Num7 speed x2 / x0.5 | Num. jump back to the game camera | F11 log camera position
; Keys are Windows virtual-key codes (decimal), e.g. key_toggle=120 is F9.
enable=1
speed=4096
; draw the sky dome around the free camera instead of the game camera (avoids hall of mirrors)
move_sky=1

[surfspy]
; log every distinct caller of the game's surface Blt / Lock / Flip (2D drawing outside the 3D device)
enable=1

[census]
; M0: log every DirectDraw/Direct3D method the game calls (counts per calling module, arguments of key calls)
enable=1

[backend]
; M1: 1 = our own DirectDraw6 -> Direct3D 9 back end (REMIX.md section 5) instead of [chain] (dgVoodoo / system ddraw).
; 0 = old behaviour: everything goes to the [chain] DLL.
d3d9=0
; which d3d9.dll to use: empty = the system one (C:\Windows\SysWOW64\d3d9.dll). Later (M2): d3d9.dll = the Remix bridge in the game folder.
d3d9_path=
; 1 = wait for vertical sync
vsync=1
; lens flares read the depth buffer: 0 = always hidden (decided for Remix), 1 = always visible
lens_flares=0
; 1 = offer the game only 32-bit texture formats (test: better texture quality?)
textures_32bit=0

[remix]
; M2: 1 = when [backend] d3d9_path is the Remix bridge d3d9.dll, load the Remix API from it and log what it offers
api=1
; 0 = do not register the bridge BeginScene/EndScene/Present callbacks (to isolate problems)
callbacks=1
; ---- M3: our own 3D world for Remix (needs [backend] d3d9=1) ----
; 1 = draw the terrain from our own static buffers (built at level load), first in every frame, with the game camera
terrain=1
; drop the game's own 3D while ours replaces it (1 = drop). Objects include the sky and characters (they return in M4).
block_game_terrain=1
block_game_objects=1
block_game_effects=1
; 0 = white vertex colour (default). 1 = pass the vertex field at +2 as colour: it is NOT ARGB lighting (F-041), gives red/green tints
terrain_vertex_color=0
; draw only sectors within this distance of the camera (game units, 2048 = one cell); 0 = all
terrain_radius=0
; far plane of the projection we give Remix (game units)
far_plane=2000000
; 1 = terrain textures the game alpha-blends (e.g. water) are drawn in a second, alpha-blended pass (z-write stays on)
terrain_alpha=1
; the Remix menu takes the mouse; when its hotkey closes it, re-activate the game window so the game takes the mouse back
reacquire_after_menu=1
; Remix menu hotkey: virtual-key code (88 = X) and whether Alt is held
menu_key=88
menu_alt=1
